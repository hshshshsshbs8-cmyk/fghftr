<!doctype html>
<html><head><meta charset="utf-8"><title>LarpLab</title><style>body{margin:0;padding:18px;width:300px;background:#09090b;color:#fafafa;font:14px system-ui}h1{margin:0 0 4px;font-size:20px}.sub{color:#a1a1aa;margin-bottom:16px}.card{padding:12px;border:1px solid #27272a;border-radius:12px;margin:8px 0;background:#18181b}label{display:block;color:#a1a1aa;margin-top:10px}input{box-sizing:border-box;width:100%;margin-top:5px;padding:8px;border-radius:8px;border:1px solid #3f3f46;background:#09090b;color:white}button{width:100%;margin-top:12px;padding:9px;border:0;border-radius:8px;background:#fff;color:#09090b;font-weight:700;cursor:pointer}.note{font-size:11px;color:#71717a;line-height:1.4;margin-top:12px}</style></head><body><h1>◈ LarpLab</h1><div class="sub">Roblox UI simulator</div><div class="card"><label>Simulated Robux<input id="robux" type="number" min="0"></label><label>Simulated username<input id="username"></label><label>Simulated display name<input id="displayName"></label><button id="save">Save local profile</button></div><div class="note">All values are stored locally in this extension. LarpLab does not grant Robux, purchase items, alter account ownership, or change Roblox server data.</div><script src="popup.js"></script></body></html>
