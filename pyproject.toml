[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubpup"
version = "0.1.0"
description = "Personal data hygiene watchdog: find and remove your own data from public sources"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "PyYAML>=6.0",
    "click>=8.1",
    "cryptography>=43.0",
    "APScheduler>=3.10",
    "rich>=13.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
scrubpup = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["scrubpup"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
